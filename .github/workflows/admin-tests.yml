name: BizBug Admin Tests
on:
  push:
    paths:
      - 'admin_portal/**'
      - 'tests_admin/**'
      - 'admin-requirements.txt'
      - '.github/workflows/admin-tests.yml'
  pull_request:
    paths:
      - 'admin_portal/**'
      - 'tests_admin/**'
      - 'admin-requirements.txt'
      - '.github/workflows/admin-tests.yml'
jobs:
  isolated-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r admin-requirements.txt
          python -m pip install pytest httpx
      - name: Run role isolation and workflow tests
        run: python -m pytest tests_admin -q
