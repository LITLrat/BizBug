<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual assistant</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f8faf8;color:#314b42;font-size:13px;display:flex;flex-direction:column;height:100vh}header{padding:16px;background:#28594b;color:white}header b{display:block;font-size:15px}header small{opacity:.76}main{padding:17px;overflow:auto;flex:1}.bubble{max-width:90%;margin-bottom:12px;background:white;border:1px solid #e5eee8;padding:12px;border-radius:12px;line-height:1.6;white-space:pre-wrap}.bubble.user{margin-left:auto;background:#28594b;color:white;border:0}.options{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.options button{border-radius:18px;border:1px solid #bad9c9;padding:8px 11px;background:white;color:#306d55;font-weight:600;font-size:11px}footer{padding:13px;background:white;border-top:1px solid #e6eee9}form{display:flex;gap:5px}input{border:1px solid #dce6e0;border-radius:8px;padding:11px;min-width:0;flex:1}form button{border:0;border-radius:8px;background:#28594b;color:white;padding:0 14px}footer small{color:#94a79e;font-size:10px;display:block;text-align:center;margin-top:7px}</style></head><body><header><b id="title">Business assistant</b><small>● Online · English / Español</small></header><main id="messages"></main><footer><form id="form"><input aria-label="Message" id="input" placeholder="How can we help?" maxlength="1400" required><button>➤</button></form><small>Appointment requests require staff confirmation.</small></footer><script>
const params=new URLSearchParams(location.search),bid=params.get('business')||'bloom';let sid=null,busy=false;
const box=document.getElementById('messages');const safe=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function add(text,role='assistant'){const el=document.createElement('div');el.className='bubble '+role;el.textContent=text;box.appendChild(el);box.scrollTop=box.scrollHeight;}
function choices(list){const old=document.querySelector('.options');if(old)old.remove();const div=document.createElement('div');div.className='options';list.forEach(o=>{const b=document.createElement('button');b.textContent=o.startsWith('SERVICE::')?o.slice(9):o.startsWith('SLOT::')?new Date(o.slice(6)).toLocaleString():o;b.onclick=()=>send(o);div.appendChild(b);});box.appendChild(div);box.scrollTop=box.scrollHeight;}
async function send(message){if(busy)return;busy=true;add(message.startsWith('SERVICE::')?message.slice(9):message.startsWith('SLOT::')?'Requested time: '+new Date(message.slice(6)).toLocaleString():message,'user');document.querySelector('.options')?.remove();try{const r=await fetch('/api/businesses/'+encodeURIComponent(bid)+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,session_id:sid})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');sid=d.session_id;add(d.reply);if(d.options?.length)choices(d.options);}catch{add('Sorry, something went wrong. Please try again.')}finally{busy=false;}}
document.getElementById('form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('input'),v=input.value.trim();if(v){input.value='';send(v)}};
fetch('/api/businesses/'+encodeURIComponent(bid)).then(r=>r.json()).then(b=>{document.getElementById('title').textContent=b.name||'Business assistant';if(/^#[0-9a-f]{6}$/i.test(b.accent||'')){document.querySelector('header').style.background=b.accent;document.querySelector('form button').style.background=b.accent;}add(b.greeting||'Hello! How can I help?');choices(['What are your hours?','Book appointment','Leave a message']);}).catch(()=>add('Welcome! How can I help?'));
</script></body></html>
